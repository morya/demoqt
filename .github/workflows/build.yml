name: Build and Package

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-2022

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure and Build with CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="${{ env.QT_ROOT_DIR }}"
          cmake --build build --config Release

      - name: Upload artifact (demo-settings.exe)
        uses: actions/upload-artifact@v4
        with:
          name: demo-settings.exe
          path: build/demo-settings.exe
          if-no-files-found: error

  build-macos:
    runs-on: macos-14

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          cache: true

      - name: Configure and Build with CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$QT_ROOT_DIR"
          cmake --build build --config Release

      - name: Upload artifact (demo-settings-macos)
        uses: actions/upload-artifact@v4
        with:
          name: demo-settings-macos
          path: build/demo-settings-macos
          if-no-files-found: error
